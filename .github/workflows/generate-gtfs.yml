name: Generate GTFS Feed

on:
  schedule:
    - cron: '1 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['hkgtfs/**', 'scripts/**', 'requirements.txt', '.github/workflows/generate-gtfs.yml']

concurrency:
  group: generate-gtfs
  cancel-in-progress: false

jobs:
  generate-gtfs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -yq mdbtools osmium-tool
          pip install -r requirements.txt
          go install github.com/patrickbr/gtfstidy@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          curl -sSfL -o validator.jar https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar

      # Only the incremental GMB store persists between runs; every other source is fetched fresh.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/gmb.json
          key: gmb-${{ github.run_id }}
          restore-keys: gmb-

      - name: Build feed
        run: python -m hkgtfs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/gmb.json
          key: gmb-${{ github.run_id }}

      - name: Post-process
        run: scripts/postprocess.sh

      - name: Validate
        run: |
          java -Xmx12g -jar validator.jar -i hk.gtfs.zip -o validation -c hk
          python3 -c "
          import json, sys
          notices = json.load(open('validation/report.json'))['notices']
          errors = [n for n in notices if n['severity'] == 'ERROR']
          for n in notices: print(n['severity'], n['code'], n['totalNotices'])
          sys.exit(1 if errors else 0)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: hk.gtfs.zip
          path: hk.gtfs.zip
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: includefares-hk.gtfs.zip
          path: includefares-hk.gtfs.zip
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: hk-drop-shapes.gtfs.zip
          path: hk-drop-shapes.gtfs.zip
          retention-days: 90

  deploy-pages:
    needs: generate-gtfs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hk.gtfs.zip
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: includefares-hk.gtfs.zip
          path: dist

      - name: Create index.html
        run: |
          cat > dist/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>Hong Kong Community GTFS</title>
            <style>
              body { background:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Noto Sans', 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Segoe UI Emoji'; margin: 2rem; line-height: 1.5; }
              a { color: #0969da; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <img src="https://raw.githubusercontent.com/wheelstransit/hongkong-community-gtfs/main/images/logomark-light.png" alt="Hong Kong Community GTFS" style="height:48px; width:auto; display:block;" />
            <p>
              Repository: <a href="https://github.com/wheelstransit/hongkong-community-gtfs">github.com/wheelstransit/hongkong-community-gtfs</a>
            </p>
            <p>
              Standard GTFS feed: <a href="./hk.gtfs.zip" download>hk.gtfs.zip</a>
            </p>
            <p>
              GTFS feed with non-standard fares: <a href="./includefares-hk.gtfs.zip" download>includefares-hk.gtfs.zip</a>
            </p>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
